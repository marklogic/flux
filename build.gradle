plugins {
  id 'net.saliman.properties' version '1.5.2'
  id "org.sonarqube" version "7.0.1.6134"
}

sonar {
  properties {
    property "sonar.projectKey", "flux"
    property "sonar.host.url", "http://localhost:9000"
    property "sonar.coverage.jacoco.xmlReportPaths", "code-coverage-report/build/reports/jacoco/testCodeCoverageReport/testCodeCoverageReport.xml"
    // Avoids a warning from Gradle.
    property "sonar.gradle.skipCompile", "true"
  }
}

subprojects {
  apply plugin: "java-library"

  group = "com.marklogic"

  java {
    toolchain {
      languageVersion = JavaLanguageVersion.of(17)
    }
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
  }

  // Allows for quickly identifying compiler warnings.
  tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ["-Xlint:unchecked", "-Xlint:deprecation"]
    options.deprecation = true
    options.warnings = true
  }

  javadoc.failOnError = false
  // Ignores warnings on params that don't have descriptions, which is a little too noisy
  javadoc.options.addStringOption('Xdoclint:none', '-quiet')

  repositories {
    mavenCentral()

    mavenLocal()

    // For temporary dependencies on internal snapshots.
    maven {
      url = "https://bed-artifactory.bedford.progress.com:443/artifactory/ml-maven-snapshots/"
    }

    // Allows for resolving the Spark connector dependency from a GH packages repository.
    if (project.hasProperty("ghPackagesUrl")) {
      maven {
        url ghPackagesUrl
        credentials {
          username = ghActor
          password = ghToken
        }
      }
    }
  }

 configurations.configureEach {
   resolutionStrategy.eachDependency { DependencyResolveDetails details ->
     // Defining this rule for io.netty here so that it affects both flux-cli and flux-embedding-model-azure-open-ai.
     if (details.requested.group.equals("io.netty") && (details.requested.version.startsWith("4.1.") || details.requested.version.startsWith("4.2."))) {
       details.useVersion "${nettyVersion}"
       details.because "Force all io.netty 4.x to ${nettyVersion} to address CVEs including CVE-2026-44249, CVE-2026-50010, and CVE-2026-45416 in netty-handler."
     }

     if (details.requested.group.equals("org.apache.logging.log4j") && details.requested.version.startsWith("2.")) {
       details.useVersion "${log4jVersion}"
       details.because "Forces all log4j 2.x artifacts that Spark brings in to ${log4jVersion} to address BDSA-2026-22385 / CVE-2026-49844 and other CVEs."
     }

     if (details.requested.group.startsWith("com.fasterxml.jackson")) {
       if (details.requested.name == "jackson-annotations") {
         // This oddly does not have a 2.21.0 or 2.21.1 release, just 2.21.
         details.useVersion "2.21"
       } else {
         details.useVersion jacksonVersion
       }
       details.because "Force Jackson to 2.21.x to align with Java Client 8.1.0."
     }
      if (details.requested.group.equals("org.xerial.snappy") && details.requested.name.equals("snappy-java")) {
        details.useVersion "${snappyVersion}"
        details.because "Forces snappy-java to ${snappyVersion} to remediate 1.1.10.8 CVEs per MLE-33626."
      }
     if (details.requested.group.equals("org.apache.thrift") && details.requested.name.equals("libthrift")) {
       // This is being done solely for Black Duck's sake, as it seems to be having trouble recognizing that the
       // internal snapshot build of the MarkLogic Spark connector is already using version 0.24.0.
       details.useVersion "0.24.0"
       details.because "Forces Spark 4.2.x to use the latest libthrift, which is needed to avoid CVEs."
     }

     if (details.requested.group.equals("org.codehaus.janino")) {
       details.useVersion "${janinoVersion}"
       details.because "Forces Janino to ${janinoVersion} to address CVE-2023-33546."
     }
   }
 }

  test {
    useJUnitPlatform()
    testLogging {
      events = ['started', 'passed', 'skipped', 'failed']
      exceptionFormat = 'full'
    }
    jvmArgs = [
      // Needed for all Java 17 testing.
      "--add-opens", "java.base/sun.nio.ch=ALL-UNNAMED",

      // For Spark's SerializationDebugger when using Java 17. See ReprocessTest for one example of why this is needed.
      "--add-opens", "java.base/sun.security.action=ALL-UNNAMED",

      // Needed by the JDBC tests.
      "--add-opens", "java.base/sun.util.calendar=ALL-UNNAMED",

      // Needed by CustomImportTest
      "--add-opens", "java.base/java.io=ALL-UNNAMED",
      "--add-opens", "java.base/sun.nio.cs=ALL-UNNAMED"
    ]
  }
}

// ---------------------------------------------------------------------------------------------
// Iron Bank container image. The ./ironbank directory is the Repo1 project (Dockerfile,
// hardening_manifest.yaml, README, LICENSE, scripts, config); ./ironbank-local holds the local
// validation harness. See ironbank/README.md and docs/ironbank/container-design.md.
// ---------------------------------------------------------------------------------------------
def ironbankDir = layout.projectDirectory.dir("ironbank")
def ironbankLocalDir = layout.projectDirectory.dir("ironbank-local")
def embedderModules = ["minilm", "ollama", "azure-open-ai"]
def ironbankWithEmbedders = (findProperty("ironbankWithEmbedders") ?: "false").toString().toBoolean()

// Building the distribution from `develop` needs the internal Artifactory (SNAPSHOT connector). Off the
// Progress network, stage a downloaded release zip instead: -PironbankFluxZip=path/to/marklogic-flux-2.1.2.zip
def ironbankFluxZip = findProperty("ironbankFluxZip")

tasks.register("ironbankStageZip", Copy) {
  group = "ironbank"
  description = "Copies the Flux distribution zip into ./ironbank as marklogic-flux.zip (gitignored). Use -PironbankFluxZip=<file> to stage a downloaded release zip instead of building one."
  if (ironbankFluxZip) {
    from ironbankFluxZip
  } else {
    // Subprojects are evaluated after the root script, so their tasks are looked up lazily.
    dependsOn ":flux-cli:distZip"
    from { project(":flux-cli").tasks.named("distZip") }
  }
  rename { "marklogic-flux.zip" }
  into ironbankDir
}

tasks.register("ironbankStageEmbedders", Copy) {
  group = "ironbank"
  description = "Copies the embedder shadow jars into ./ironbank-local/ext for the mounted-jar smoke tests."
  embedderModules.each { name ->
    dependsOn ":flux-embedding-model-${name}:shadowJar"
    from({ project(":flux-embedding-model-${name}").tasks.named("shadowJar") }) {
      rename { "flux-embedding-model-${name}.jar" }
    }
  }
  into ironbankLocalDir.dir("ext")
}

tasks.register("ironbankStage") {
  group = "ironbank"
  description = "Stages the image build inputs. Add -PironbankWithEmbedders=true to bake the embedder jars into /opt/flux/ext."
  dependsOn "ironbankStageZip", "ironbankStageEmbedders"
  doLast {
    def extOpt = ironbankDir.dir("ext-opt").asFile
    extOpt.mkdirs()
    fileTree(extOpt) { include "*.jar" }.each { it.delete() }
    if (ironbankWithEmbedders) {
      copy {
        from ironbankLocalDir.dir("ext")
        include "*.jar"
        into extOpt
      }
    }
  }
}

tasks.register("ironbankBuild", Exec) {
  group = "ironbank"
  description = "Builds the Iron Bank-style image locally. Override the base with -PironbankBaseRegistry, -PironbankBaseImage and -PironbankBaseTag."
  dependsOn "ironbankStage"
  workingDir ironbankDir
  def baseRegistry = findProperty("ironbankBaseRegistry") ?: "registry.access.redhat.com"
  def baseImage = findProperty("ironbankBaseImage") ?: "ubi9/openjdk-17-runtime"
  def baseTag = findProperty("ironbankBaseTag") ?: "1.21"
  def imageName = findProperty("ironbankImageName") ?: "marklogic-flux-ironbank"
  doFirst {
    // Scripts and config end up inside a Linux image; CRLF endings would break them silently.
    fileTree(ironbankDir) { include "Dockerfile", "scripts/**", "config/**" }.each { f ->
      if (f.text.contains("\r")) {
        throw new GradleException("${f} has CRLF line endings; run 'git add --renormalize ironbank' (see .gitattributes).")
      }
    }
  }
  commandLine "docker", "build", "--pull",
    "--build-arg", "BASE_REGISTRY=${baseRegistry}",
    "--build-arg", "BASE_IMAGE=${baseImage}",
    "--build-arg", "BASE_TAG=${baseTag}",
    "-t", "${imageName}:${version}",
    "-t", "${imageName}:local",
    "."
}

tasks.register("ironbankManifestResources") {
  group = "ironbank"
  description = "Prints the hardening_manifest.yaml 'resources' entry (GitHub release URL and sha256) for the staged Flux zip."
  dependsOn "ironbankStageZip"
  doLast {
    def zip = ironbankDir.file("marklogic-flux.zip").asFile
    def digest = java.security.MessageDigest.getInstance("SHA-256")
    zip.withInputStream { stream ->
      byte[] buffer = new byte[1 << 16]
      int read
      while ((read = stream.read(buffer)) > 0) { digest.update(buffer, 0, read) }
    }
    def sha256 = digest.digest().encodeHex().toString()
    println """
resources:
  - url: https://github.com/marklogic/flux/releases/download/${version}/marklogic-flux-${version}.zip
    filename: marklogic-flux.zip
    validation:
      type: sha256
      value: "${sha256}"

(sha256 of the locally staged ${zip.name}; for a submission, compute it against the published release asset)
"""
  }
}

tasks.register("ironbankSmokeTest", Exec) {
  group = "ironbank"
  description = "Runs ironbank-local/smoke-test.sh against the locally built image. Requires the docker compose test stack and the deployed test-app."
  dependsOn "ironbankBuild"
  workingDir layout.projectDirectory
  commandLine "bash", "ironbank-local/smoke-test.sh"
}

tasks.register("gettingStartedZip", Zip) {
  description = "Creates a zip of the getting-started project that is intended to be included as a downloadable file " +
    "on the GitHub release page."
  from "examples/getting-started"
  exclude "build", ".gradle", "gradle-*.properties", "flux", ".gitignore", "marklogic-flux"
  exclude "src/main/ml-schemas/tde/chunks.json"
  into "marklogic-flux-getting-started-${version}"
  archiveFileName = "marklogic-flux-getting-started-${version}.zip"
  destinationDirectory = file("build")
}
