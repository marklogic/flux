# Two Flux Jobs with the restricted pod settings from ironbank/README.md:
#   flux-import  - the plain form: Flux arguments in `args`
#   flux-batch   - a mounted script that runs several Flux commands in one container
# The ConfigMap `flux-data` (input files) is created by k8s-smoke.sh from the Flux test fixtures.
apiVersion: v1
kind: Secret
metadata:
  name: flux-options
  namespace: flux-smoke
stringData:
  options.txt: |
    --connection-string
    "admin:admin@marklogic:8000"
    --spark-master-url
    local[2]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: flux-batch-script
  namespace: flux-smoke
data:
  batch.sh: |
    #!/bin/sh
    # Import, export to the scratch volume, copy to another collection, then report counts.
    set -eu
    # --uri-prefix keeps these URIs apart from the flux-import Job, which reads the same files concurrently.
    flux import-files @/run/secrets/flux/options.txt --path /workspace/data --collections k8s-batch --uri-prefix /batch
    flux export-files @/run/secrets/flux/options.txt --collections k8s-batch --path /tmp/export
    flux copy @/run/secrets/flux/options.txt --collections k8s-batch \
      --output-connection-string "admin:admin@marklogic:8000" --output-collections k8s-batch-copy
    echo "batch: exported $(find /tmp/export -type f | wc -l) files"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: flux-import
  namespace: flux-smoke
spec:
  backoffLimit: 0
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 0
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: flux
          image: ${FLUX_IMAGE}
          imagePullPolicy: Never
          args:
            - import-files
            - "@/run/secrets/flux/options.txt"
            - --path
            - /workspace/data
            - --collections
            - k8s-import
            - --uri-prefix
            - /import
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: options
              mountPath: /run/secrets/flux
              readOnly: true
            - name: data
              mountPath: /workspace/data
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
        - name: options
          secret:
            secretName: flux-options
            defaultMode: 0440
        - name: data
          configMap:
            name: flux-data
---
apiVersion: batch/v1
kind: Job
metadata:
  name: flux-batch
  namespace: flux-smoke
spec:
  backoffLimit: 0
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 0
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: flux
          image: ${FLUX_IMAGE}
          imagePullPolicy: Never
          args: ["sh", "/workspace/batch/batch.sh"]
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: options
              mountPath: /run/secrets/flux
              readOnly: true
            - name: data
              mountPath: /workspace/data
              readOnly: true
            - name: batch
              mountPath: /workspace/batch
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
        - name: options
          secret:
            secretName: flux-options
            defaultMode: 0440
        - name: data
          configMap:
            name: flux-data
        - name: batch
          configMap:
            name: flux-batch-script
